<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limbo — Monte Carlo Simulation of the Gambler's Fallacy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="left-panel">
        <div class="stat-item">
            <span class="stat-label">Solde</span>
            <span class="stat-value"><span id="balance">1000.00</span> €</span>
        </div>

        <div class="stat-item">
            <span class="stat-label">Mise</span>
            <input type="number" id="betInput" value="0.00" min="0.00" step="0.01">
        </div>

        <div class="stat-item">
            <span class="stat-label">Gains</span>
            <span class="stat-value" id="wins">0</span>
        </div>

        <div class="stat-item">
            <span class="stat-label">Pertes</span>
            <span class="stat-value" id="losses">0</span>
        </div>

        <div class="stat-item">
            <span class="stat-label">Taux de gain</span>
            <span class="stat-value"><span id="winrate">0.00</span>%</span>
        </div>

        <div id="error"></div>

        <button id="toggleBtn">Lancer le Pari Automatiquement</button>
    </div>

    <div class="right-panel">
        <div class="history-container" id="history"></div>

        <div class="multiplier-display">
            <span class="multiplier-value" id="mult">-</span>
        </div>

        <div class="target-container">
            <span class="target-label">Multiplicateur cible</span>
            <input type="number" id="targetInput" class="target-input" value="2.00" min="1.00" step="0.01">
        </div>
    </div>

    <!-- Loaded in dependency order; these are plain globals, not modules. -->
    <script src="src/seedGenerator.js"></script>
    <script src="src/limboAlgorithm.js"></script>
    <script src="src/balanceManager.js"></script>
    <script src="src/gameState.js"></script>
    <script src="src/ui.js"></script>
    <script src="src/gameController.js"></script>
    <script src="src/experiment.js"></script>
    <script src="strategies/strategy1Martingale.js"></script>
    <script src="src/main.js"></script>
</body>
</html>
